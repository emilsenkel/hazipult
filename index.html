<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HáziPult • Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/pocketbase@0.21.5/dist/pocketbase.umd.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600&amp;display=swap');
    body { font-family: 'Inter', system_ui, sans-serif; }
    .title-font { font-family: 'Poppins', 'Inter', sans-serif; font-weight: 600; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Login Screen -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-lg">
          <i class="fa-solid fa-book text-white text-3xl"></i>
        </div>
        <h1 class="title-font text-4xl font-semibold tracking-tight">HáziPult</h1>
        <p class="text-slate-500 mt-2">Jelentkezz be a fiókoddal</p>
      </div>

      <div class="bg-white rounded-3xl shadow p-8">
        <form id="login-form" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1.5">Email</label>
            <input id="login-email" type="email" required 
                   class="w-full border border-slate-200 rounded-2xl px-4 py-3 focus:outline-none focus:border-indigo-400 text-sm"
                   placeholder="david@csalad.hu">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1.5">Jelszó</label>
            <input id="login-password" type="password" required
                   class="w-full border border-slate-200 rounded-2xl px-4 py-3 focus:outline-none focus:border-indigo-400 text-sm"
                   placeholder="••••••••">
          </div>
          <button type="submit"
                  class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 transition-colors text-white font-semibold py-3.5 rounded-2xl text-sm">
            Bejelentkezés
          </button>
        </form>
      </div>
      <p class="text-center text-xs text-slate-400 mt-6">
        Kérd a szüleidet, hogy hozzanak létre neked fiókot a PocketBase-ben.
      </p>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-screen" class="hidden">
    <header class="bg-white border-b sticky top-0 z-50">
      <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-x-3">
          <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center">
            <i class="fa-solid fa-book text-white"></i>
          </div>
          <div>
            <span class="title-font text-2xl font-semibold tracking-tight">HáziPult</span>
          </div>
        </div>

        <div class="flex items-center gap-x-4">
          <div class="text-right">
            <div id="user-name" class="font-semibold text-sm"></div>
            <div class="text-[10px] text-slate-500 -mt-0.5">bejelentkezve</div>
          </div>
          <button onclick="logout()" 
                  class="text-sm px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-2xl font-medium flex items-center gap-x-2 transition-colors">
            <i class="fa-solid fa-sign-out-alt"></i>
            <span>Kijelentkezés</span>
          </button>
        </div>
      </div>
    </header>

    <div class="max-w-5xl mx-auto px-6 py-8">
      <!-- Stats -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-3xl p-5 border">
          <div class="text-xs font-semibold text-rose-500 tracking-wider">MAI FELADATOK</div>
          <div id="stat-today" class="text-4xl font-bold mt-1">0</div>
        </div>
        <div class="bg-white rounded-3xl p-5 border">
          <div class="text-xs font-semibold text-amber-500 tracking-wider">EZEN A HÉTEN</div>
          <div id="stat-week" class="text-4xl font-bold mt-1">0</div>
        </div>
        <div class="bg-white rounded-3xl p-5 border">
          <div class="text-xs font-semibold text-emerald-500 tracking-wider">KÉSZ</div>
          <div id="stat-done" class="text-4xl font-bold mt-1">0</div>
        </div>
        <div class="bg-white rounded-3xl p-5 border">
          <div class="text-xs font-semibold text-indigo-500 tracking-wider">AKTÍV</div>
          <div id="stat-active" class="text-4xl font-bold mt-1">0</div>
        </div>
      </div>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-semibold tracking-tight">Feladataim</h2>
        <button onclick="showAddModal()"
                class="flex items-center gap-x-2 bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-2xl text-sm font-medium transition-colors">
          <i class="fa-solid fa-plus"></i>
          <span>Új feladat</span>
        </button>
      </div>

      <!-- Tasks -->
      <div id="tasks-container" class="space-y-3">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div id="modal" onclick="if (event.target.id === 'modal') closeModal()" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
    <div onclick="event.stopImmediatePropagation()" class="bg-white w-full max-w-md rounded-3xl shadow-xl p-6">
      <h3 id="modal-title-text" class="text-xl font-semibold mb-5">Új házi feladat</h3>

      <div class="space-y-4">
        <div>
          <label class="text-sm font-medium text-slate-600">Tantárgy</label>
          <input id="modal-subject" type="text" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 mt-1 text-sm" placeholder="Matematika">
        </div>
        <div>
          <label class="text-sm font-medium text-slate-600">Cím / Leírás</label>
          <input id="modal-title" type="text" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 mt-1 text-sm" placeholder="Oldal 45-48">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-sm font-medium text-slate-600">Határidő</label>
            <input id="modal-due" type="date" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 mt-1 text-sm">
          </div>
          <div>
            <label class="text-sm font-medium text-slate-600">Prioritás</label>
            <select id="modal-priority" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 mt-1 text-sm">
              <option value="low">Alacsony</option>
              <option value="medium" selected>Közepes</option>
              <option value="high">Magas</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-sm font-medium text-slate-600">Fotó (opcionális)</label>
          <input id="modal-image" type="file" accept="image/*" class="mt-1 text-sm">
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <button onclick="closeModal()" class="flex-1 py-3 bg-slate-100 rounded-2xl font-medium text-sm">Mégse</button>
        <button onclick="saveTask()" class="flex-1 py-3 bg-indigo-600 text-white rounded-2xl font-medium text-sm">Mentés</button>
      </div>
    </div>
  </div>

  <script>
    const POCKETBASE_URL = "https://hazipult.chez-emil-ai.com";
    const pb = new PocketBase(POCKETBASE_URL);

    let currentUser = null;

    // Login
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const authData = await pb.collection('users').authWithPassword(email, password);
        currentUser = authData.record;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-name').textContent = currentUser.name || currentUser.email.split('@')[0];
        loadTasks();
      } catch (err) {
        alert('Hibás email vagy jelszó!');
      }
    });

    function logout() {
      pb.authStore.clear();
      location.reload();
    }

    async function loadTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '<div class="text-center py-8 text-slate-400">Betöltés...</div>';

      try {
        const records = await pb.collection('assignments').getFullList({
          filter: `user_id = "${currentUser.id}"`,
          sort: '-created',
        });

        renderTasks(records);
        updateStats(records);
      } catch (err) {
        container.innerHTML = '<div class="text-red-500 text-center py-8">Hiba történt a betöltéskor.</div>';
        console.error(err);
      }
    }

    function updateStats(tasks) {
      const today = new Date().toISOString().split('T')[0];
      let todayCount = 0, weekCount = 0, doneCount = 0, activeCount = 0;

      tasks.forEach(t => {
        if (t.completed) doneCount++;
        else activeCount++;

        if (t.due_date === today && !t.completed) todayCount++;
      });

      document.getElementById('stat-today').textContent = todayCount;
      document.getElementById('stat-week').textContent = weekCount;
      document.getElementById('stat-done').textContent = doneCount;
      document.getElementById('stat-active').textContent = activeCount;
    }

    function renderTasks(tasks) {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';

      if (tasks.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-400">Még nincsenek feladataid.</div>`;
        return;
      }

      tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = `bg-white border border-slate-100 rounded-3xl p-4 flex gap-4 items-start ${task.completed ? 'opacity-75' : ''}`;

        let imageHtml = '';
        if (task.image) {
          const imgUrl = `${POCKETBASE_URL}/api/files/assignments/${task.id}/${task.image}`;
          imageHtml = `<img src="${imgUrl}" class="w-14 h-14 object-cover rounded-2xl mt-2 border cursor-pointer" onclick="window.open('${imgUrl}', '_blank')">`;
        }

        div.innerHTML = `
          <div class="flex-1">
            <div class="flex items-center gap-x-2 mb-1">
              <span class="px-3 py-0.5 text-xs font-semibold rounded-full bg-blue-100 text-blue-700">${task.subject}</span>
              <span class="text-xs px-2.5 py-0.5 rounded-xl font-bold ${task.priority === 'high' ? 'bg-rose-100 text-rose-600' : task.priority === 'medium' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'}">${task.priority.toUpperCase()}</span>
            </div>
            <div class="font-semibold leading-tight ${task.completed ? 'line-through text-slate-400' : ''}">${task.title}</div>
            <div class="text-xs text-slate-500 mt-1">Határidő: ${task.due_date}</div>
            ${imageHtml}
          </div>

          <div class="flex flex-col items-end justify-between h-full">
            <input type="checkbox" ${task.completed ? 'checked' : ''} 
                   class="w-5 h-5 accent-indigo-600" 
                   onchange="toggleComplete('${task.id}', this.checked)">
            
            <button onclick="deleteTask('${task.id}')" class="text-red-400 hover:text-red-600 mt-auto">
              <i class="fa-solid fa-trash text-sm"></i>
            </button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    async function toggleComplete(id, completed) {
      try {
        await pb.collection('assignments').update(id, { completed });
        loadTasks();
      } catch (e) {
        alert('Hiba történt');
      }
    }

    async function deleteTask(id) {
      if (!confirm('Biztosan törlöd ezt a feladatot?')) return;
      try {
        await pb.collection('assignments').delete(id);
        loadTasks();
      } catch (e) {
        alert('Hiba történt');
      }
    }

    function showAddModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      document.getElementById('modal-subject').value = '';
      document.getElementById('modal-title').value = '';
      document.getElementById('modal-due').value = '';
      document.getElementById('modal-priority').value = 'medium';
      document.getElementById('modal-image').value = '';
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function saveTask() {
      const subject = document.getElementById('modal-subject').value.trim();
      const title = document.getElementById('modal-title').value.trim();
      const due = document.getElementById('modal-due').value;
      const priority = document.getElementById('modal-priority').value;
      const imageInput = document.getElementById('modal-image');

      if (!subject || !title || !due) {
        alert('Töltsd ki a kötelező mezőket!');
        return;
      }

      const data = {
        user_id: currentUser.id,
        subject,
        title,
        due_date: due,
        priority,
        completed: false
      };

      try {
        if (imageInput.files.length > 0) {
          const formData = new FormData();
          Object.keys(data).forEach(k => formData.append(k, data[k]));
          formData.append('image', imageInput.files[0]);
          await pb.collection('assignments').create(formData);
        } else {
          await pb.collection('assignments').create(data);
        }
        closeModal();
        loadTasks();
      } catch (e) {
        console.error(e);
        alert('Hiba történt a mentéskor.');
      }
    }

    function checkLogin() {
      if (pb.authStore.isValid) {
        currentUser = pb.authStore.model;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-name').textContent = currentUser.name || currentUser.email.split('@')[0];
        loadTasks();
      }
    }

    window.onload = function() {
      checkLogin();
    };
  </script>
</body>
</html>
