<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HáziPult">
  <title>HáziPult • Cloud</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/pocketbase@0.21.5/dist/pocketbase.umd.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600&amp;display=swap');
    body { font-family: 'Inter', system_ui, sans-serif; }
    .title-font { font-family: 'Poppins', 'Inter', sans-serif; font-weight: 600; }
    .stat-card { transition: transform 0.2s ease; }
    .task-card { transition: all 0.2s ease; }
    .task-card:hover { transform: translateY(-1px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Login Screen -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-slate-50 to-slate-100">
    <div class="max-w-md w-full">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-xl">
          <i class="fa-solid fa-book text-white text-3xl"></i>
        </div>
        <h1 class="title-font text-4xl font-semibold tracking-tight text-slate-900">HáziPult</h1>
        <p class="text-slate-500 mt-2 text-lg">Jelentkezz be a fiókoddal</p>
      </div>

      <div class="bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
        <form id="login-form" class="space-y-6">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Felhasználónév</label>
            <input id="login-username" type="text" required 
                   class="w-full border border-slate-200 focus:border-indigo-400 rounded-2xl px-4 py-3 text-base outline-none transition-colors"
                   placeholder="oliver">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Jelszó</label>
            <input id="login-password" type="password" required
                   class="w-full border border-slate-200 focus:border-indigo-400 rounded-2xl px-4 py-3 text-base outline-none transition-colors"
                   placeholder="••••••••">
          </div>
          <button type="submit"
                  class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl text-base transition-all shadow-lg hover:shadow-xl">
            Bejelentkezés
          </button>
        </form>
      </div>
      <p class="text-center text-xs text-slate-400 mt-6">
        Kérd a szüleidet, hogy hozzanak létre neked fiókot
      </p>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-screen" class="hidden">
    <header class="bg-white border-b border-slate-100 sticky top-0 z-50">
      <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-x-3">
          <div class="w-11 h-11 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-sm">
            <i class="fa-solid fa-book text-white text-2xl"></i>
          </div>
          <div>
            <span class="title-font text-3xl font-semibold tracking-tighter text-slate-900">HáziPult</span>
          </div>
        </div>

        <div class="flex items-center gap-x-4">
          <div class="text-right">
            <div id="user-name" class="font-semibold text-slate-800"></div>
            <div class="text-xs text-slate-500 -mt-0.5">bejelentkezve</div>
          </div>
          <button onclick="logout()" 
                  class="px-4 py-2 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl font-medium flex items-center gap-x-2 transition-colors">
            <i class="fa-solid fa-sign-out-alt"></i>
            <span>Kijelentkezés</span>
          </button>
        </div>
      </div>
    </header>

    <div class="max-w-5xl mx-auto px-6 py-8">
      <!-- Stats Row -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 stat-card">
          <div class="text-xs font-bold tracking-wider text-rose-500">MAI FELADATOK</div>
          <div id="stat-today" class="text-4xl font-bold text-slate-900 mt-1">0</div>
        </div>
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 stat-card">
          <div class="text-xs font-bold tracking-wider text-amber-500">EZEN A HÉTEN</div>
          <div id="stat-week" class="text-4xl font-bold text-slate-900 mt-1">0</div>
        </div>
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 stat-card">
          <div class="text-xs font-bold tracking-wider text-emerald-500">KÉSZ</div>
          <div id="stat-done" class="text-4xl font-bold text-slate-900 mt-1">0</div>
        </div>
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 stat-card">
          <div class="text-xs font-bold tracking-wider text-indigo-500">AKTÍV</div>
          <div id="stat-active" class="text-4xl font-bold text-slate-900 mt-1">0</div>
        </div>
      </div>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-semibold tracking-tight text-slate-900">Feladataim</h2>
        <button onclick="showAddModal()"
                class="group flex items-center gap-x-2 bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-2xl font-semibold text-sm transition-all active:scale-[0.985]">
          <i class="fa-solid fa-plus group-active:rotate-90 transition-transform"></i>
          <span>Új feladat</span>
        </button>
      </div>

      <!-- Tasks List -->
      <div id="tasks-container" class="space-y-3">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div id="modal" onclick="if (event.target.id === 'modal') closeModal()" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div onclick="event.stopImmediatePropagation()" class="bg-white w-full max-w-md rounded-3xl shadow-2xl border border-slate-100 overflow-hidden">
      <div class="px-6 py-5 border-b">
        <h3 id="modal-title-text" class="text-xl font-semibold text-slate-900">Új házi feladat</h3>
      </div>

      <div class="p-6 space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Tantárgy</label>
          <input id="modal-subject" type="text" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-400" placeholder="Matematika">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Cím / Leírás</label>
          <input id="modal-title" type="text" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-400" placeholder="Oldal 45-48">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Határidő</label>
            <input id="modal-due" type="date" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-400">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Prioritás</label>
            <select id="modal-priority" class="w-full border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-400">
              <option value="low">Alacsony</option>
              <option value="medium" selected>Közepes</option>
              <option value="high">Magas</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Fotó (opcionális)</label>
          <input id="modal-image" type="file" accept="image/*" class="w-full text-sm mt-1">
        </div>
      </div>

      <div class="border-t bg-slate-50 px-6 py-4 flex gap-3">
        <button onclick="closeModal()" class="flex-1 py-3 text-sm font-semibold bg-white border border-slate-200 text-slate-700 rounded-2xl hover:bg-slate-100 transition-colors">Mégse</button>
        <button onclick="saveTask()" class="flex-1 py-3 text-sm font-semibold bg-indigo-600 text-white rounded-2xl hover:bg-indigo-500 transition-colors">Mentés</button>
      </div>
    </div>
  </div>

  <script>
    const POCKETBASE_URL = "https://hazipult.chez-emil-ai.com";
    const pb = new PocketBase(POCKETBASE_URL);

    let currentUser = null;

    // Login form
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const authData = await pb.collection('users').authWithPassword(username, password);
        currentUser = authData.record;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-name').textContent = currentUser.name || currentUser.username || username;
        loadTasks();
      } catch (err) {
        alert('Hibás felhasználónév vagy jelszó!');
      }
    });

    function logout() {
      pb.authStore.clear();
      location.reload();
    }

    async function loadTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '<div class="text-center py-8 text-slate-400">Betöltés...</div>';

      try {
        const records = await pb.collection('assignments').getFullList({
          filter: `user_id = "${currentUser.id}"`,
          sort: '-due_date',
        });

        renderTasks(records);
        updateStats(records);
      } catch (err) {
        container.innerHTML = '<div class="text-red-500 text-center py-8">Hiba történt a betöltéskor.</div>';
        console.error(err);
      }
    }

    function updateStats(tasks) {
      const today = new Date().toISOString().split('T')[0];
      let todayCount = 0, weekCount = 0, doneCount = 0, activeCount = 0;

      tasks.forEach(t => {
        if (t.completed) doneCount++;
        else activeCount++;

        if (t.due_date === today && !t.completed) todayCount++;
      });

      document.getElementById('stat-today').textContent = todayCount;
      document.getElementById('stat-week').textContent = weekCount;
      document.getElementById('stat-done').textContent = doneCount;
      document.getElementById('stat-active').textContent = activeCount;
    }

    function renderTasks(tasks) {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';

      if (tasks.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-400">Még nincsenek feladataid.</div>`;
        return;
      }

      tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = `bg-white border border-slate-100 rounded-3xl p-4 flex gap-4 items-start task-card ${task.completed ? 'opacity-75' : ''}`;

        let imageHtml = '';
        if (task.image) {
          const imgUrl = `${POCKETBASE_URL}/api/files/assignments/${task.id}/${task.image}`;
          imageHtml = `<img src="${imgUrl}" class="w-16 h-16 object-cover rounded-2xl mt-2 border border-slate-200 cursor-pointer" onclick="window.open('${imgUrl}', '_blank')">`;
        }

        div.innerHTML = `
          <div class="flex-1">
            <div class="flex items-center gap-x-2 mb-1.5">
              <span class="px-3 py-1 text-xs font-bold rounded-full bg-blue-100 text-blue-700">${task.subject}</span>
              <span class="text-xs px-2 py-0.5 rounded-xl font-bold ${task.priority === 'high' ? 'bg-rose-100 text-rose-600' : task.priority === 'medium' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'}">${task.priority.toUpperCase()}</span>
            </div>
            <div class="font-semibold text-base leading-snug ${task.completed ? 'line-through text-slate-400' : 'text-slate-800'}">${task.title}</div>
            <div class="text-xs text-slate-500 mt-2 flex items-center gap-x-1">
              <i class="fa-regular fa-calendar"></i>
              <span>Határidő: ${task.due_date}</span>
            </div>
            ${imageHtml}
          </div>

          <div class="flex flex-col items-end justify-between">
            <input type="checkbox" ${task.completed ? 'checked' : ''} 
                   class="w-5 h-5 accent-indigo-600 cursor-pointer" 
                   onchange="toggleComplete('${task.id}', this.checked)">
            
            <button onclick="deleteTask('${task.id}')" class="text-red-400 hover:text-red-600 mt-4">
              <i class="fa-solid fa-trash text-sm"></i>
            </button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    async function toggleComplete(id, completed) {
      try {
        await pb.collection('assignments').update(id, { completed });
        loadTasks();
      } catch (e) {
        alert('Hiba történt');
      }
    }

    async function deleteTask(id) {
      if (!confirm('Biztosan törlöd ezt a feladatot?')) return;
      try {
        await pb.collection('assignments').delete(id);
        loadTasks();
      } catch (e) {
        alert('Hiba történt');
      }
    }

    function showAddModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      document.getElementById('modal-subject').value = '';
      document.getElementById('modal-title').value = '';
      document.getElementById('modal-due').value = '';
      document.getElementById('modal-priority').value = 'medium';
      document.getElementById('modal-image').value = '';
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function saveTask() {
      const subject = document.getElementById('modal-subject').value.trim();
      const title = document.getElementById('modal-title').value.trim();
      const due = document.getElementById('modal-due').value;
      const priority = document.getElementById('modal-priority').value;
      const imageInput = document.getElementById('modal-image');

      if (!subject || !title || !due) {
        alert('Töltsd ki a kötelező mezőket!');
        return;
      }

      const data = {
        user_id: currentUser.id,
        subject,
        title,
        due_date: due,
        priority,
        completed: false
      };

      try {
        if (imageInput.files.length > 0) {
          const formData = new FormData();
          Object.keys(data).forEach(k => formData.append(k, data[k]));
          formData.append('image', imageInput.files[0]);
          await pb.collection('assignments').create(formData);
        } else {
          await pb.collection('assignments').create(data);
        }
        closeModal();
        loadTasks();
      } catch (e) {
        console.error(e);
        alert('Hiba történt a mentéskor.');
      }
    }

    function checkLogin() {
      if (pb.authStore.isValid) {
        currentUser = pb.authStore.model;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-name').textContent = currentUser.name || currentUser.username || currentUser.email.split('@')[0];
        loadTasks();
      }
    }

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SW registered');
          })
          .catch((error) => {
            console.log('SW failed');
          });
      });
    }

    window.onload = function() {
      checkLogin();
    };
  </script>
</body>
</html>
